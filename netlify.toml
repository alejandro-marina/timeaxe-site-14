[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.sibforms.com; form-action 'self' https://*.sibforms.com; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

# Serve the web manifest with the correct MIME (otherwise Netlify sends
# application/octet-stream, which nosniff would reject for PWA install)
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Canonicalize to extensionless URLs — 301 the .html forms to the pretty URL
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true
[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true
[[redirects]]
  from = "/legal.html"
  to = "/legal"
  status = 301
  force = true
